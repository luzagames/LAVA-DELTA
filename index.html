<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LavaDelta — Lavavajillas y lavarropas usados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20242A; --ink-soft:#565D66; --bg:#ECEDE9; --surface:#FFFFFF;
    --line:#D7D9D3; --steel:#33616F; --steel-deep:#234750; --copper:#BE6A32;
    --whatsapp:#25D366; --whatsapp-deep:#1DA851; --radius-s:3px; --radius-m:6px; --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.01em;line-height:1.02;margin:0;color:var(--ink);}
  a{color:inherit;} p{margin:0;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
  img{max-width:100%;display:block;}
  header.site{position:sticky;top:0;z-index:40;background:rgba(236,237,233,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .header-row{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:var(--maxw);margin:0 auto;gap:16px;}
  .brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;white-space:nowrap;}
  nav.site-nav{display:flex;gap:22px;flex-wrap:wrap;}
  nav.site-nav a{font-size:14.5px;font-weight:500;color:var(--ink-soft);text-decoration:none;border-bottom:2px solid transparent;padding-bottom:2px;transition:color .15s,border-color .15s;}
  nav.site-nav a:hover{color:var(--steel);border-color:var(--steel);}
  .wa-pill{display:inline-flex;align-items:center;gap:8px;background:var(--whatsapp);color:#fff;text-decoration:none;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14.5px;white-space:nowrap;transition:background .15s;}
  .wa-pill:hover{background:var(--whatsapp-deep);}
  .wa-pill svg{width:16px;height:16px;fill:#fff;flex:none;}
  .hero{position:relative;overflow:hidden;background:var(--steel-deep);color:#fff;padding:76px 0 96px;}
  .hero::after{content:"";position:absolute;right:-10%;top:-30%;width:70%;height:180%;background:var(--steel);transform:rotate(11deg);opacity:.55;}
  .hero .wrap{position:relative;z-index:2;}
  .eyebrow-plate{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:0.06em;color:#CFE3E7;border:1px solid rgba(255,255,255,0.35);padding:4px 10px;border-radius:2px;margin-bottom:18px;}
  .hero h1{font-size:clamp(40px,7vw,74px);max-width:14ch;color:#fff;}
  .hero .sub{margin-top:18px;font-size:18px;max-width:46ch;color:#DCEBEC;}
  .hero .meta-row{margin-top:26px;display:flex;flex-wrap:wrap;gap:24px;font-size:14.5px;color:#BFD9DC;}
  .hero .meta-row strong{color:#fff;font-weight:600;}
  .hero-cta{margin-top:32px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn-primary{background:var(--whatsapp);color:#fff;text-decoration:none;padding:14px 24px;border-radius:var(--radius-s);font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;gap:10px;transition:background .15s;}
  .btn-primary:hover{background:var(--whatsapp-deep);}
  .btn-primary svg{width:18px;height:18px;fill:#fff;}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;padding:13px 22px;border-radius:var(--radius-s);text-decoration:none;font-weight:500;font-size:15px;}
  @media (prefers-reduced-motion: no-preference){
    .hero-anim{animation:riseIn .7s cubic-bezier(.2,.7,.2,1) both;}
    .hero-anim.d2{animation-delay:.08s;} .hero-anim.d3{animation-delay:.16s;} .hero-anim.d4{animation-delay:.24s;}
    @keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  }
  section{padding:64px 0;}
  section.alt{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .section-head{margin-bottom:34px;max-width:64ch;}
  .section-head .kicker{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;color:var(--steel);margin-bottom:6px;}
  .section-head h2{font-size:clamp(28px,4vw,40px);}
  .about-text{font-size:17px;color:var(--ink-soft);max-width:66ch;}
  .cat-block + .cat-block{margin-top:56px;}
  .cat-header{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:26px;}
  .cat-header h3{font-size:26px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s;}
  .card:hover{border-color:var(--steel);}
  .card .img-wrap{aspect-ratio:4/3;background:#DFE1DC;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .card .img-wrap img{width:100%;height:100%;object-fit:cover;}
  .card .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card h4{font-family:'Inter',sans-serif;font-weight:600;font-size:15.5px;line-height:1.3;}
  .card .desc{font-size:13.5px;color:var(--ink-soft);}
  .card .price{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;color:var(--copper);margin-top:auto;}
  .card .contact-link{margin-top:6px;display:inline-flex;align-items:center;gap:7px;color:var(--whatsapp-deep);text-decoration:none;font-weight:600;font-size:14px;}
  .card .contact-link svg{width:14px;height:14px;fill:var(--whatsapp-deep);}
  .card .contact-link:hover{text-decoration:underline;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .info-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:26px;}
  .info-card h3{font-size:22px;margin-bottom:10px;}
  .info-card p{color:var(--ink-soft);font-size:15px;}
  .info-card.accent{background:var(--steel-deep);border-color:var(--steel-deep);}
  .info-card.accent h3,.info-card.accent p{color:#fff;}
  .info-card.accent p{color:#D9E9EB;}
  footer.site{background:#181B1F;color:#B7BCC2;padding:44px 0 60px;}
  footer.site .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center;}
  footer.site .brand-f{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:#fff;}
  footer.site .wa-line{font-size:14.5px;}
  footer.site .credit{font-size:12.5px;color:#6E747C;width:100%;padding-top:20px;border-top:1px solid #2B2F35;margin-top:14px;}
  .loading-note{padding:80px 24px;text-align:center;color:var(--ink-soft);}
  @media (max-width:760px){
    nav.site-nav{display:none;} .info-grid{grid-template-columns:1fr;} .hero{padding:56px 0 72px;}
    footer.site .wrap{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading-note">Cargando…</div></div>

<script>
const ICON_WA = '<svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-1.5-.7-2.5-1.3-3.5-3-.3-.5.3-.4.7-1.4.1-.2 0-.3 0-.4-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.3 0 1.4 1 2.7 1.1 2.9.1.2 2 3 4.8 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.6 1.4 5.1L2 22l5.1-1.3c1.4.8 3.1 1.2 4.9 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.1c-1.6 0-3.2-.4-4.5-1.2l-.3-.2-3.3.9.9-3.2-.2-.3c-.9-1.4-1.4-3-1.4-4.7 0-4.6 3.8-8.4 8.4-8.4s8.4 3.8 8.4 8.4-3.7 8.7-8 8.7z"/></svg>';

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function waLink(number, text){ return 'https://wa.me/' + number + (text ? ('?text=' + encodeURIComponent(text)) : ''); }

function productCard(business, p){
  const msg = 'Hola! Te consulto por: ' + p.name;
  return `
    <div class="card">
      <div class="img-wrap"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.opacity=0.15"/></div>
      <div class="body">
        <h4>${esc(p.name)}</h4>
        ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
        <p class="price">$${esc(p.price)}</p>
        <a class="contact-link" href="${waLink(business.whatsapp, msg)}" target="_blank" rel="noopener">${ICON_WA} Consultar por WhatsApp</a>
      </div>
    </div>`;
}

function render(DATA){
  const b = DATA.business;
  const app = document.getElementById('app');

  const header = `
    <header class="site">
      <div class="header-row">
        <div class="brand">${esc(b.name)}</div>
        <nav class="site-nav">
          <a href="#nosotros">Nosotros</a>
          <a href="#productos">Productos</a>
          <a href="#repuestos">Repuestos</a>
          <a href="#plancanje-card">Plan Canje</a>
          <a href="#envios">Envíos</a>
        </nav>
        <a class="wa-pill" href="${waLink(b.whatsapp,'Hola! Quiero consultar por un lavavajillas.')}" target="_blank" rel="noopener">${ICON_WA} WhatsApp</a>
      </div>
    </header>`;

  const hero = `
    <section class="hero">
      <div class="wrap">
        <span class="eyebrow-plate hero-anim">${esc(b.location)}</span>
        <h1 class="hero-anim d2">${esc(b.tagline)}</h1>
        <div class="meta-row hero-anim d3">
          <span>Garantía: <strong>1 mes</strong></span>
          <span>Entrega: <strong>probado y funcionando</strong></span>
          <span>WhatsApp: <strong>${esc(b.whatsappDisplay)}</strong></span>
        </div>
        <div class="hero-cta hero-anim d4">
          <a class="btn-primary" href="${waLink(b.whatsapp,'Hola! Quiero consultar por un lavavajillas.')}" target="_blank" rel="noopener">${ICON_WA} Escribir por WhatsApp</a>
          <a class="btn-ghost" href="#productos">Ver productos</a>
        </div>
      </div>
    </section>`;

  const about = `
    <section id="nosotros">
      <div class="wrap">
        <div class="section-head"><div class="kicker">Nosotros</div><h2>¿Qué es ${esc(b.name)}?</h2></div>
        <p class="about-text">${esc(DATA.about)}</p>
      </div>
    </section>`;

  const products = `
    <section class="alt" id="productos">
      <div class="wrap">
        <div class="section-head"><div class="kicker">Catálogo</div><h2>Productos disponibles</h2></div>
        ${DATA.categories.map(cat => `
          <div class="cat-block">
            <div class="cat-header"><h3>${esc(cat.title)}</h3></div>
            <div class="grid">${cat.products.map(p=>productCard(b,p)).join('')}</div>
          </div>`).join('')}
      </div>
    </section>`;

  const info = `
    <section id="repuestos">
      <div class="wrap">
        <div class="section-head"><div class="kicker">Más información</div><h2>Repuestos, plan canje y envíos</h2></div>
        <div class="info-grid">
          <div class="info-card" id="repuestos-card"><h3>Repuestos</h3><p>${esc(DATA.repuestos)}</p></div>
          <div class="info-card accent" id="plancanje-card"><h3>Plan Canje</h3><p>${esc(DATA.planCanje)}</p></div>
        </div>
        <div class="info-grid" style="margin-top:22px;" id="envios">
          <div class="info-card"><h3>Envíos</h3><p>${esc(DATA.envios)}</p></div>
        </div>
      </div>
    </section>`;

  const footer = `
    <footer class="site">
      <div class="wrap">
        <div><div class="brand-f">${esc(b.name)}</div><div class="wa-line">WhatsApp: ${esc(b.whatsappDisplay)}</div></div>
        <a class="wa-pill" href="${waLink(b.whatsapp,'Hola! Quiero consultar por un lavavajillas.')}" target="_blank" rel="noopener">${ICON_WA} Escribinos</a>
        <div class="credit">© ${new Date().getFullYear()} ${esc(b.name)} · Tigre, zona norte GBA</div>
      </div>
    </footer>`;

  app.innerHTML = header + hero + about + products + info + footer;
  document.title = b.name + ' — Lavavajillas y lavarropas usados';
}

fetch('data.json?v=' + Date.now())
  .then(r => { if(!r.ok) throw new Error('No se encontró data.json'); return r.json(); })
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML =
      '<div class="loading-note">No se pudo cargar el contenido de la página.<br>Revisá que exista el archivo data.json en el repositorio.</div>';
    console.error(err);
  });
</script>
</body>
</html>
